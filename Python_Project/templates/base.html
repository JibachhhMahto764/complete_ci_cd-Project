<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DataHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="topbar">

    <div class="brand">
        <div class="brand-icon">D</div>

        <div>
            <h1>DataHub</h1>
            <span>Data Management Platform</span>
        </div>
    </div>

    <div class="server-status">
        <span class="status-dot"></span>
        System Online
    </div>

</header>

<main class="container">

    {% block content %}
    {% endblock %}

</main>

<footer>
    DataHub • Python Flask Application
</footer>

</body>
</html>
