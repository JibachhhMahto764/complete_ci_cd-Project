{% extends "base.html" %}

{% block content %}

<section class="edit-page">

    <div class="edit-header">

        <a href="{{ url_for('index') }}">
            ← Back to records
        </a>

        <h2>Edit Record</h2>

        <p>
            Update the information for
            <strong>{{ record.name }}</strong>.
        </p>

    </div>


    <form
        class="edit-form"
        method="POST"
        action="{{ url_for('edit_record', record_id=record.id) }}">

        <div class="form-grid">

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    value="{{ record.name }}"
                    required>

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    value="{{ record.email }}"
                    required>

            </div>


            <div class="form-group">

                <label>Category</label>

                <select name="category">

                    {% for category in
                       ["Customer", "Employee", "Developer",
                        "Manager", "Other"] %}

                        <option
                            {% if record.category == category %}
                            selected
                            {% endif %}>

                            {{ category }}

                        </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label>Status</label>

                <select name="status">

                    <option
                        {% if record.status == "Active" %}
                        selected
                        {% endif %}>
                        Active
                    </option>

                    <option
                        {% if record.status == "Inactive" %}
                        selected
                        {% endif %}>
                        Inactive
                    </option>

                </select>

            </div>

        </div>


        <div class="form-group">

            <label>Notes</label>

            <textarea name="notes">{{ record.notes or "" }}</textarea>

        </div>


        <div class="modal-actions">

            <a
                href="{{ url_for('index') }}"
                class="secondary-btn">

                Cancel

            </a>

            <button
                type="submit"
                class="primary-btn">

                Save Changes

            </button>

        </div>

    </form>

</section>

{% endblock %}
